[pytest]
testpaths = tests
asyncio_mode = auto
# Un solo event loop para toda la sesion. El engine async de SQLAlchemy es un
# singleton de modulo y su pool queda atado al loop donde se abrio la primera
# conexion: con un loop por test, el segundo test revienta con
# "Event loop is closed" al reusar una conexion del pool.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
